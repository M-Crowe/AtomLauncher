<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- 背景微暗渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2330" />
      <stop offset="100%" stop-color="#11141c" />
    </linearGradient>
  </defs>

  <!-- 1. 应用底板 (64x64 方形圆角像素基底) -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="#2b3244" stroke-width="2" />
  <!-- 底板高光与暗角点缀 -->
  <path fill="#363f54" d="M10 4h44v2H10zM4 10h2v44H4z" />
  <path fill="#0a0d13" d="M10 58h44v2H10zM58 10h2v44h-2z" />

  <!-- 2. 原子轨道 (像素化椭圆轨道，青色微光 #2ce8d5 与暗青 #167a78) -->
  <!-- 轨道 A: 倾角 45° -->
  <g fill="#219a95">
    <rect x="22" y="10" width="4" height="2" />
    <rect x="26" y="12" width="4" height="2" />
    <rect x="38" y="10" width="4" height="2" />
    <rect x="34" y="12" width="4" height="2" />
    <rect x="14" y="18" width="4" height="2" />
    <rect x="18" y="14" width="4" height="2" />
    <rect x="46" y="18" width="4" height="2" />
    <rect x="42" y="14" width="4" height="2" />
    <rect x="10" y="24" width="2" height="4" />
    <rect x="12" y="20" width="2" height="4" />
    <rect x="52" y="24" width="2" height="4" />
    <rect x="50" y="20" width="2" height="4" />
    <rect x="10" y="36" width="2" height="4" />
    <rect x="12" y="40" width="2" height="4" />
    <rect x="52" y="36" width="2" height="4" />
    <rect x="50" y="40" width="2" height="4" />
    <rect x="14" y="44" width="4" height="2" />
    <rect x="18" y="48" width="4" height="2" />
    <rect x="46" y="44" width="4" height="2" />
    <rect x="42" y="48" width="4" height="2" />
    <rect x="22" y="52" width="4" height="2" />
    <rect x="26" y="50" width="4" height="2" />
    <rect x="38" y="52" width="4" height="2" />
    <rect x="34" y="50" width="4" height="2" />
  </g>
  <!-- 轨道内侧亮色线 -->
  <g fill="#4ff3e4">
    <rect x="24" y="11" width="4" height="1" />
    <rect x="36" y="11" width="4" height="1" />
    <rect x="12" y="23" width="2" height="4" />
    <rect x="50" y="37" width="2" height="4" />
    <rect x="24" y="52" width="4" height="1" />
    <rect x="36" y="52" width="4" height="1" />
  </g>

  <!-- 轨道 B: 倾角 -45° 对称轨道 -->
  <g fill="#17738f">
    <rect x="14" y="28" width="2" height="8" />
    <rect x="48" y="28" width="2" height="8" />
    <rect x="16" y="22" width="2" height="6" />
    <rect x="46" y="22" width="2" height="6" />
    <rect x="16" y="36" width="2" height="6" />
    <rect x="46" y="36" width="2" height="6" />
    <rect x="18" y="16" width="4" height="4" />
    <rect x="42" y="16" width="4" height="4" />
    <rect x="18" y="44" width="4" height="4" />
    <rect x="42" y="44" width="4" height="4" />
    <rect x="22" y="14" width="6" height="2" />
    <rect x="36" y="14" width="6" height="2" />
    <rect x="22" y="48" width="6" height="2" />
    <rect x="36" y="48" width="6" height="2" />
    <rect x="28" y="12" width="8" height="2" />
    <rect x="28" y="50" width="8" height="2" />
  </g>

  <!-- 3. 外层插件电子 (代表各种外挂 Mod/插件模块) -->
  <!-- 插件 A: 绿宝石色电子 (Top-Right) -->
  <rect x="44" y="12" width="6" height="6" fill="#0f2617" />
  <rect x="45" y="13" width="4" height="4" fill="#17dd62" />
  <rect x="45" y="13" width="2" height="2" fill="#a4ffbe" />

  <!-- 插件 B: 浅蓝青金石电子 (Bottom-Left) -->
  <rect x="14" y="46" width="6" height="6" fill="#0d243b" />
  <rect x="15" y="47" width="4" height="4" fill="#2b82ff" />
  <rect x="15" y="47" width="2" height="2" fill="#a2d7ff" />

  <!-- 插件 C: 荧石金黄电子 (Right-Mid) -->
  <rect x="52" y="31" width="6" height="6" fill="#302008" />
  <rect x="53" y="32" width="4" height="4" fill="#ffb41d" />
  <rect x="53" y="32" width="2" height="2" fill="#fff4aa" />

  <!-- 4. 原子核心：Minecraft 风格核心能量方块 (Isometric 3D 像素方块) -->
  <!-- 核心光晕外溢 -->
  <rect x="26" y="26" width="12" height="12" fill="#ff2a4b" opacity="0.25" />

  <!-- 顶面 (浅红/红石亮面) -->
  <polygon points="32,22 40,26 32,30 24,26" fill="#ff526b" />
  <polygon points="32,24 37,26.5 32,29 27,26.5" fill="#ff8597" />

  <!-- 左暗面 (深红宝石色) -->
  <polygon points="24,26 32,30 32,40 24,36" fill="#a61730" />
  <polygon points="25,28 31,31 31,38 25,35" fill="#c41c3a" />

  <!-- 右侧面 (中红石色) -->
  <polygon points="32,30 40,26 40,36 32,40" fill="#db1c3e" />
  <polygon points="33,31 39,28 39,35 33,38" fill="#ee3253" />

  <!-- 核心高光方块点 -->
  <rect x="31" y="25" width="2" height="2" fill="#ffffff" />
</svg>
